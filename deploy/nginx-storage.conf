# =============================================================================
# nginx-storage.conf — Laravel storage hardening for Ihyaa (backend)
# -----------------------------------------------------------------------------
# الغرض: حماية مجلد /storage من تنفيذ سكربتات PHP ومن كشف الملفات الحساسة
# (dotfiles مثل .env و .git)، مع فرض رؤوس أمان على الاستجابات.
#
# Purpose: harden the public `/storage` location so that:
#   1. PHP (and other server-side scripts) can never be executed from storage.
#   2. Dotfiles / sensitive files (`.env`, `.git`, `.htaccess`, ...) are denied.
#   3. All responses carry `X-Content-Type-Options: nosniff`.
#
# USAGE (الاستخدام):
#   - Upload this file to the server, e.g.  /etc/nginx/snippets/nginx-storage.conf
#   - Include it INSIDE the Laravel `server { ... }` block, AFTER `root` is set:
#
#       server {
#           root   /var/www/ihyaa/backend/public;   # MUST point to Laravel's public/
#           index  index.php;
#
#           include snippets/nginx-storage.conf;    # <-- this snippet
#
#           location / {
#               try_files $uri $uri/ /index.php?$query_string;
#           }
#
#           location ~ \.php$ {
#               fastcgi_pass unix:/run/php/php8.3-fpm.sock;
#               fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#               include fastcgi_params;
#           }
#       }
#
#   - `nginx -t` to validate, then `nginx -s reload`.
#
# NOTES / ملاحظات:
#   - Root MUST be Laravel's `public/` directory. The `.env`, `composer.*`,
#     `storage/framework`, etc. live OUTSIDE `public/` and are never web-accessible.
#   - Laravel symlinks `storage/app/public` -> `public/storage`; this snippet
#     secures that web-visible `/storage` path.
#   - `location ^~` (no-negotiation prefix) wins over any outer regex location,
#     including the generic `location ~ \.php$` (PHP-FPM) rule above, so a
#     request like `/storage/evil.php` is handled HERE and denied instead of
#     being dispatched to PHP-FPM.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Web-visible storage root.
#    `^~` gives this prefix priority over every regex location in the server
#    block, so the generic PHP-FPM rule can never process files under /storage.
#    All responses under /storage get hardened headers.
# -----------------------------------------------------------------------------
location ^~ /storage/ {
    autoindex off;                                   # never list directory contents

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # -------------------------------------------------------------------------
    # 1a) Never execute PHP (or any server-side script) served from storage.
    #     The nested regex location is evaluated only within this /storage block.
    # -------------------------------------------------------------------------
    location ~ \.php$              { deny all; }
    location ~ \.phar$             { deny all; }
    location ~* \.(pl|py|cgi|asp|aspx|sh|jsp|shtml)$ { deny all; }

    # -------------------------------------------------------------------------
    # 1b) Deny dotfiles and sensitive files (.env, .git, .htaccess, .user.ini).
    #     `.env` is normally outside the web root, but this guards storage in
    #     case anything dot-prefixed ever lands there.
    # -------------------------------------------------------------------------
    location ~ /\. { deny all; }

    # -------------------------------------------------------------------------
    # 1c) Serve legitimate static assets. `try_files ... =404` prevents nginx
    #     from falling through to `index.php` for missing storage files.
    # -------------------------------------------------------------------------
    try_files $uri =404;
}

# =============================================================================
# ALTERNATIVE (flat) FORM — use instead of the `^~` block above if your nginx
# version / config style forbids nested locations. All rules are plain regex
# locations; the two `deny` rules must appear BEFORE the generic `\.php$`
# PHP-FPM location in the server block so they win the regex race.
# =============================================================================
# location ~* ^/storage/.*\.(php|phar|pl|py|cgi|asp|aspx|sh|jsp|shtml)$ { deny all; }
# location ~* ^/storage/(\.|.*/\.)  { deny all; }
#
# location /storage/ {
#     autoindex off;
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-Frame-Options "SAMEORIGIN" always;
#     try_files $uri =404;
# }

# =============================================================================
# GENERAL HARDENING CHECKLIST (server-level, NOT part of this snippet)
# =============================================================================
#   server_tokens off;                        # hide nginx version banner
#   root /var/www/ihyaa/backend/public;       # NEVER point root at the repo root
#   client_max_body_size 10m;                 # match your upload limits
#   add_header X-Content-Type-Options "nosniff" always;   # also at server level
#   gzip on; gzip_types text/plain text/css application/json application/javascript;
